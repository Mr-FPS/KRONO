<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="KRONO — Minimalist Mobile Monochrome Glass Calendar and Tasks Planner." />
  <title>KRONO</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --ink: #ffffff;
      --ink-muted: #9a9a9a;
      --ink-secondary: #d4d4d4;
      --ink-on-solid: #000000;

      --outer-bg: #000000;
      --phone-bg: #000000;
      --glass-alpha: 0.08;
      --glass-sub-alpha: 0.04;
      --glass-bg: rgba(255, 255, 255, var(--glass-alpha));
      --glass-bg-subtle: rgba(255, 255, 255, var(--glass-sub-alpha));
      --glass-bg-strong: rgba(16, 16, 16, 0.94);
      --glass-hover: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-strong: rgba(255, 255, 255, 0.30);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      --glass-blur: 18px;

      --input-bg: #121212;
      --input-border: rgba(255, 255, 255, 0.24);
      --input-focus: #ffffff;

      --radius: 16px;
      --radius-sm: 11px;
      --radius-lg: 20px;
      --font-family: 'Vazirmatn', 'Inter', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      --font-size: 14px;
      --tasks-ratio: 52%;
      --transition: 160ms ease;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --ink: #000000;
      --ink-muted: #666666;
      --ink-secondary: #262626;
      --ink-on-solid: #ffffff;

      --outer-bg: #000000;
      --phone-bg: #f0f0f0;
      --glass-alpha: 0.68;
      --glass-sub-alpha: 0.48;
      --glass-bg: rgba(255, 255, 255, var(--glass-alpha));
      --glass-bg-subtle: rgba(255, 255, 255, var(--glass-sub-alpha));
      --glass-bg-strong: rgba(255, 255, 255, 0.96);
      --glass-hover: rgba(0, 0, 0, 0.07);
      --glass-border: rgba(0, 0, 0, 0.14);
      --glass-border-strong: rgba(0, 0, 0, 0.28);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.9);

      --input-bg: #ffffff;
      --input-border: rgba(0, 0, 0, 0.22);
      --input-focus: #000000;
    }

    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--outer-bg);
      color: var(--ink);
      font-family: var(--font-family);
      font-size: var(--font-size);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; padding: 0; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--glass-border-strong); border-radius: 99px; }

    /* Centered Mobile Frame with Pure Black Sides on Desktop */
    .phone-frame {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      max-height: 920px;
      background: var(--phone-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-inline: 1px solid var(--glass-border);
    }

    @media (min-width: 480px) and (min-height: 760px) {
      .phone-frame {
        height: min(96dvh, 880px);
        border-radius: 26px;
        border: 1px solid var(--glass-border);
      }
    }

    @media (max-width: 479px) {
      .phone-frame {
        max-width: 100%;
        max-height: 100dvh;
        border: none;
        border-radius: 0;
      }
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-highlight);
    }

    /* Top Header */
    .top-header {
      padding: 11px 14px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      flex-shrink: 0;
    }

    .header-left {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .header-brand-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .app-brand {
      font-size: 0.72em;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .sync-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.68em;
      padding: 1px 7px;
      border-radius: 99px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg-subtle);
      color: var(--ink-secondary);
      white-space: nowrap;
      transition: background var(--transition);
    }
    .sync-chip:hover { background: var(--glass-hover); }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
    .sync-dot.pending { background: transparent; border: 1.5px solid var(--ink); }
    .sync-dot.syncing { animation: pulse 0.9s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .header-date-title {
      font-size: 0.98em;
      font-weight: 700;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--glass-bg-subtle);
      border: 1px solid var(--glass-border);
      color: var(--ink);
      transition: all var(--transition);
    }
    .icon-btn:hover { background: var(--glass-hover); border-color: var(--glass-border-strong); }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn.solid { background: var(--ink); color: var(--ink-on-solid); border-color: var(--ink); }

    /* Split Workspace (Tasks Top + Draggable Divider + Calendar Bottom) */
    .split-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* UPPER SECTION: TASKS */
    .tasks-pane {
      flex: 0 0 var(--tasks-ratio);
      min-height: 120px;
      display: flex;
      flex-direction: column;
      padding: 10px 14px 4px;
      overflow: hidden;
    }

    .tasks-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .tasks-bar-title {
      font-size: 0.84em;
      font-weight: 600;
      color: var(--ink-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-tabs {
      display: inline-flex;
      background: var(--glass-bg-subtle);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 2px;
      gap: 2px;
    }

    .pill-tabs button {
      font-size: 0.74em;
      padding: 3px 9px;
      border-radius: 99px;
      color: var(--ink-muted);
      transition: all var(--transition);
    }

    .pill-tabs button.active {
      background: var(--ink);
      color: var(--ink-on-solid);
      font-weight: 600;
    }

    .occasions-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .tasks-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-bottom: 4px;
    }

    .task-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-highlight);
      transition: background var(--transition), border-color var(--transition);
      cursor: pointer;
    }

    .task-card:hover { background: var(--glass-hover); border-color: var(--glass-border-strong); }
    .task-card.done { opacity: 0.42; }
    .task-card.done .task-title { text-decoration: line-through; }
    .task-card.overdue { border-inline-start: 3px solid var(--ink); }

    .check-btn {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 1.8px solid var(--glass-border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .check-btn.checked { background: var(--ink); border-color: var(--ink); color: var(--ink-on-solid); }
    .check-btn svg { width: 11px; height: 11px; }

    .task-content { flex: 1; min-width: 0; }
    .task-title { font-weight: 600; font-size: 0.92em; word-break: break-word; }
    .task-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      margin-top: 3px;
      font-size: 0.73em;
      color: var(--ink-muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 0.74em;
      font-weight: 500;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg-subtle);
      color: var(--ink-secondary);
      white-space: nowrap;
    }

    .badge-solid {
      background: var(--ink);
      color: var(--ink-on-solid);
      border-color: var(--ink);
      font-weight: 700;
    }

    .empty-tasks {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      font-size: 0.84em;
      border: 1px dashed var(--glass-border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
    }

    /* DRAGGABLE RESIZE HANDLE */
    .split-handle {
      flex-shrink: 0;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: row-resize;
      touch-action: none;
      user-select: none;
    }

    .split-handle-bar {
      width: 44px;
      height: 4px;
      border-radius: 99px;
      background: var(--glass-border-strong);
      transition: width var(--transition), background var(--transition);
    }

    .split-handle:hover .split-handle-bar,
    .split-handle.dragging .split-handle-bar {
      width: 64px;
      background: var(--ink);
    }
    .split-handle.locked {
      cursor: default;
      pointer-events: none;
      height: 8px;
    }
    .split-handle.locked .split-handle-bar {
      opacity: 0.2;
      width: 28px;
    }

    /* LOWER SECTION: CALENDAR */
    .calendar-pane {
      flex: 1;
      min-height: 205px;
      margin: 0 10px 10px;
      padding: 10px 11px;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    .cal-month-nav { display: flex; align-items: center; gap: 5px; }
    .cal-month-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--glass-bg-subtle);
      border: 1px solid var(--glass-border);
    }
    .cal-month-btn:hover { background: var(--glass-hover); }
    .cal-month-btn svg { width: 14px; height: 14px; }

    .cal-month-label { font-weight: 700; font-size: 0.9em; padding: 2px 6px; border-radius: 8px; }
    .cal-month-label:hover { background: var(--glass-hover); }

    .cal-sys-pills {
      display: inline-flex;
      background: var(--glass-bg-subtle);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 2px;
      gap: 2px;
    }

    .cal-sys-pills button {
      font-size: 0.7em;
      padding: 2px 7px;
      border-radius: 99px;
      color: var(--ink-muted);
    }
    .cal-sys-pills button.active { background: var(--ink); color: var(--ink-on-solid); font-weight: 600; }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 0.7em;
      font-weight: 600;
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    .cal-days {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: 1fr;
      gap: 4px;
    }

    .cal-day {
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 0.84em;
      font-weight: 500;
      border: 1px solid transparent;
      background: var(--glass-bg-subtle);
      transition: background var(--transition), border-color var(--transition);
      min-height: 0;
    }

    .cal-day:hover { background: var(--glass-hover); border-color: var(--glass-border); }
    .cal-day.other-month { opacity: 0.25; }
    .cal-day.is-today { border-color: var(--ink); font-weight: 700; }
    .cal-day.is-selected { background: var(--ink); color: var(--ink-on-solid); border-color: var(--ink); font-weight: 700; }
    .cal-day.is-holiday:not(.is-selected) { text-decoration: underline; text-underline-offset: 3px; }
    .cal-day.drag-over { border: 1px dashed var(--ink); background: var(--glass-hover); }

    .cal-dots { display: flex; align-items: center; gap: 2px; height: 4px; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink); }
    .cal-day.is-selected .cal-dot { background: var(--ink-on-solid); }
    .cal-dot.muted { opacity: 0.4; }

    /* Bottom Sheet Modal */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-height: 88%;
      background: var(--glass-bg-strong);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-top: 1px solid var(--glass-border-strong);
      border-radius: 22px 22px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: sheetUp 170ms ease-out;
    }
    @keyframes sheetUp { from { transform: translateY(20px); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }

    .modal-header {
      padding: 13px 16px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .modal-title { font-size: 0.96em; font-weight: 700; margin: 0; }
    .modal-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
    .modal-footer {
      padding: 10px 16px 14px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    /* High-Contrast Form Controls (Fixed for Dark & Light) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 0.86em;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg-subtle);
      color: var(--ink);
      transition: all var(--transition);
    }
    .btn:hover { background: var(--glass-hover); border-color: var(--glass-border-strong); }
    .btn-solid { background: var(--ink); color: var(--ink-on-solid); border-color: var(--ink); font-weight: 600; }
    .btn-sm { padding: 5px 10px; font-size: 0.8em; }
    .btn svg { width: 15px; height: 15px; }

    .input, .select, .textarea {
      width: 100%;
      background-color: var(--input-bg);
      color: var(--ink);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .select {
      background-image: linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%), linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%);
      background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-inline-end: 28px;
    }

    html[dir="rtl"] .select {
      background-position: 14px 50%, 9px 50%;
    }

    .select option {
      background-color: var(--input-bg);
      color: var(--ink);
    }

    .input:focus, .select:focus, .textarea:focus { border-color: var(--input-focus); }
    .input::placeholder, .textarea::placeholder { color: var(--ink-muted); }
    .input-num { direction: ltr; text-align: center; font-variant-numeric: tabular-nums; }
    .textarea { resize: vertical; min-height: 66px; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--ink);
      cursor: pointer;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .form-label { font-size: 0.8em; color: var(--ink-muted); font-weight: 500; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .st-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      background: var(--glass-bg-subtle);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 3px;
    }
    .st-tabs button { flex: 1; padding: 6px 6px; font-size: 0.78em; border-radius: 8px; color: var(--ink-muted); }
    .st-tabs button.active { background: var(--ink); color: var(--ink-on-solid); font-weight: 600; }

    .toast-stack {
      position: absolute;
      top: 62px;
      inset-inline: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 80;
      pointer-events: none;
    }
    .toast {
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border-strong);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 0.82em;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="phone-frame" id="phoneFrame">
    <!-- TOP HEADER -->
    <header class="top-header">
      <div class="header-left">
        <div class="header-brand-row">
          <span class="app-brand">KRONO</span>
          <button class="sync-chip" id="syncStatusChip" type="button"></button>
        </div>
        <h1 class="header-date-title" id="headerDateTitle"></h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnTodayQuick" style="display:none;width:auto;padding:0 9px;font-size:0.76em;font-weight:600;"></button>
        <button class="icon-btn" id="btnSearch" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="icon-btn solid" id="btnAddTask" aria-label="New Task">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="icon-btn" id="btnSettings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- SPLIT WORKSPACE -->

  /* =========================================================================
     MODULE 2: TRIPLE CALENDAR ENGINE (Jalali, Gregorian, Hijri)
     ========================================================================= */
  const CalendarEngine = (() => {
    const pad = n => String(n).padStart(2, '0');
    const div = (a, b) => Math.trunc(a / b);

    function g2d(gy, gm, gd) {
      let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4)
        + div(153 * ((gm + 9) % 12) + 2, 5)
        + gd - 34840408;
      return d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
    }
    function d2g(jdn) {
      let j = 4 * jdn + 139361631;
      j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
      const i = div((j % 1461), 4) * 5 + 308;
      const gd = div((i % 153), 5) + 1;
      const gm = (div(i, 153) % 12) + 1;
      const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
      return { y: gy, m: gm, d: gd };
    }

    const JALALI_BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
    function jalCal(jy) {
      let gy = jy + 621, leapJ = -14, jp = JALALI_BREAKS[0], jump = 0;
      for (let i = 1; i < JALALI_BREAKS.length; i++) {
        const jm = JALALI_BREAKS[i];
        jump = jm - jp;
        if (jy < jm) break;
        leapJ = leapJ + div(jump, 33) * 8 + div(jump % 33, 4);
        jp = jm;
      }
      let n = jy - jp;
      leapJ = leapJ + div(n, 33) * 8 + div((n % 33) + 3, 4);
      if ((jump % 33) === 4 && (jump - n) === 4) leapJ += 1;
      const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
      const march = 20 + leapJ - leapG;
      if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
      let leap = (((n + 1) % 33) - 1) % 4;
      if (leap === -1) leap = 4;
      return { leap, gy, march };
    }
    function j2d(jy, jm, jd) { const r = jalCal(jy); return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1; }
    function d2j(jdn) {
      const gy = d2g(jdn).y; let jy = gy - 621; const r = jalCal(jy);
      let k = jdn - g2d(gy, 3, r.march);
      if (k >= 0) {
        if (k <= 185) return { y: jy, m: 1 + div(k, 31), d: (k % 31) + 1 };
        k -= 186; return { y: jy, m: 7 + div(k, 30), d: (k % 30) + 1 };
      }
      jy -= 1; k += 179; if (r.leap === 1) k += 1;
      return { y: jy, m: 7 + div(k, 30), d: (k % 30) + 1 };
    }
    function jalaliMonthLength(jy, jm) { return jm <= 6 ? 31 : jm <= 11 ? 30 : (jalCal(jy).leap === 0 ? 30 : 29); }

    function h2d(hy, hm, hd) { return hd + Math.ceil(29.5 * (hm - 1)) + (hy - 1) * 354 + div(3 + 11 * hy, 30) + 1948439; }
    function d2h(jdn) {
      let l = jdn - 1948440 + 10632;
      const n = div(l - 1, 10631);
      l = l - 10631 * n + 354;
      const j = (div(10985 - l, 5316)) * (div(50 * l, 17719)) + (div(l, 5670)) * (div(43 * l, 15238));
      l = l - (div(30 - j, 15)) * (div(17719 * j, 50)) - (div(j, 16)) * (div(15238 * j, 43)) + 29;
      const hm = div(24 * l, 709);
      const hd = l - div(709 * hm, 24);
      const hy = 30 * n + j - 30;
      return { y: hy, m: hm, d: hd };
    }
    function hijriMonthLength(hy, hm) { return hm % 2 === 1 ? 30 : (hm === 12 && ((11 * hy + 14) % 30) < 11 ? 30 : 29); }
    function gregorianMonthLength(gy, gm) { return new Date(gy, gm, 0).getDate(); }

    function isoFromG(gy, gm, gd) { return `${gy}-${pad(gm)}-${pad(gd)}`; }
    function parseISO(iso) { if (!iso) return null; const [y, m, d] = iso.split('-').map(Number); return (y && m && d) ? { y, m, d } : null; }
    function todayISO() { const n = new Date(); return isoFromG(n.getFullYear(), n.getMonth() + 1, n.getDate()); }
    function addDaysISO(iso, delta) { const g = parseISO(iso); const ng = d2g(g2d(g.y, g.m, g.d) + delta); return isoFromG(ng.y, ng.m, ng.d); }
    function weekdayOfISO(iso) { const g = parseISO(iso); return new Date(g.y, g.m - 1, g.d).getDay(); }
    function fromISO(iso, sys, hOff = 0) {
      const g = parseISO(iso); if (!g) return null;
      if (sys === 'gregorian') return g;
      const jdn = g2d(g.y, g.m, g.d);
      return sys === 'jalali' ? d2j(jdn) : d2h(jdn + (Number(hOff) || 0));
    }
    function toISO(y, m, d, sys, hOff = 0) {
      if (sys === 'gregorian') return isoFromG(y, m, d);
      if (sys === 'jalali') { const g = d2g(j2d(y, m, d)); return isoFromG(g.y, g.m, g.d); }
      const g = d2g(h2d(y, m, d) - (Number(hOff) || 0));
      return isoFromG(g.y, g.m, g.d);
    }
    function monthLength(y, m, sys) { return sys === 'jalali' ? jalaliMonthLength(y, m) : sys === 'hijri' ? hijriMonthLength(y, m) : gregorianMonthLength(y, m); }

    const MONTHS = {
      jalali: {
        fa: ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'],
        en: ['Farvardin', 'Ordibehesht', 'Khordad', 'Tir', 'Mordad', 'Shahrivar', 'Mehr', 'Aban', 'Azar', 'Dey', 'Bahman', 'Esfand']
      },
      gregorian: {
        fa: ['ژانویه', 'فوریه', 'مارس', 'آوریل', 'مه', 'ژوئن', 'ژوئیه', 'اوت', 'سپتامبر', 'اکتبر', 'نوامبر', 'دسامبر'],
        en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
      },
      hijri: {
        fa: ['محرم', 'صفر', 'ربیع‌الاول', 'ربیع‌الثانی', 'جمادی‌الاول', 'جمادی‌الثانی', 'رجب', 'شعبان', 'رمضان', 'شوال', 'ذیقعده', 'ذیحجه'],
        en: ['Muharram', 'Safar', 'Rabi I', 'Rabi II', 'Jumada I', 'Jumada II', 'Rajab', 'Shaban', 'Ramadan', 'Shawwal', 'Dhu al-Qadah', 'Dhu al-Hijjah']
      }
    };
    const WEEKDAYS_SHORT = { fa: ['ی', 'د', 'س', 'چ', 'پ', 'ج', 'ش'], en: ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'] };
    const WEEKDAYS_FULL = { fa: ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه', 'شنبه'], en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'] };

    const OCCASIONS = {
      jalali: {
        '1-1': { fa: 'نوروز', en: 'Nowruz', holiday: true }, '1-2': { fa: 'عید نوروز', en: 'Nowruz', holiday: true },
        '1-3': { fa: 'عید نوروز', en: 'Nowruz', holiday: true }, '1-4': { fa: 'عید نوروز', en: 'Nowruz', holiday: true },
        '1-12': { fa: 'روز جمهوری اسلامی', en: 'Islamic Republic Day', holiday: true },
        '1-13': { fa: 'سیزده‌بدر', en: 'Nature Day', holiday: true },
        '3-14': { fa: 'رحلت امام خمینی', en: 'Mourning Day', holiday: true },
        '3-15': { fa: 'قیام ۱۵ خرداد', en: '15 Khordad', holiday: true },
        '9-30': { fa: 'شب یلدا', en: 'Yalda Night', holiday: false },
        '11-22': { fa: '۲۲ بهمن', en: '22 Bahman', holiday: true },
        '12-29': { fa: 'ملی شدن صنعت نفت', en: 'Oil Day', holiday: true }
      },
      hijri: {
        '1-9': { fa: 'تاسوعا', en: 'Tasua', holiday: true }, '1-10': { fa: 'عاشورا', en: 'Ashura', holiday: true },
        '2-20': { fa: 'اربعین', en: 'Arbaeen', holiday: true }, '3-17': { fa: 'میلاد پیامبر', en: 'Prophet Birthday', holiday: true },
        '7-27': { fa: 'عید مبعث', en: 'Mabath', holiday: true }, '8-15': { fa: 'نیمه شعبان', en: 'Mid-Shaban', holiday: true },
        '10-1': { fa: 'عید فطر', en: 'Eid al-Fitr', holiday: true }, '12-10': { fa: 'عید قربان', en: 'Eid al-Adha', holiday: true },
        '12-18': { fa: 'عید غدیر', en: 'Eid al-Ghadir', holiday: true }
      }
    };

    function getMonthName(sys, m, lang) { return MONTHS[sys][lang === 'en' ? 'en' : 'fa'][m - 1] || ''; }
    function getWeekdayOrder(firstDay) { return Array.from({ length: 7 }, (_, i) => (firstDay + i) % 7); }
    function formatISO(iso, sys, lang, hOff = 0, includeYear = true) {
      if (!iso) return '';
      const d = fromISO(iso, sys, hOff);
      const mn = getMonthName(sys, d.m, lang);
      const dayStr = lang === 'fa' ? I18N.num(d.d) : d.d;
      const yearStr = lang === 'fa' ? I18N.num(d.y) : d.y;
      return includeYear ? `${dayStr} ${mn} ${yearStr}` : `${dayStr} ${mn}`;
    }
    function getOccasions(iso, hOff = 0) {
      const list = [];
      const j = fromISO(iso, 'jalali', hOff), h = fromISO(iso, 'hijri', hOff);
      if (OCCASIONS.jalali[`${j.m}-${j.d}`]) list.push(OCCASIONS.jalali[`${j.m}-${j.d}`]);
      if (OCCASIONS.hijri[`${h.m}-${h.d}`]) list.push(OCCASIONS.hijri[`${h.m}-${h.d}`]);
      return list;
    }

    return { todayISO, addDaysISO, parseISO, weekdayOfISO, fromISO, toISO, monthLength, getMonthName, getWeekdayOrder, WEEKDAYS_SHORT, WEEKDAYS_FULL, formatISO, getOccasions };
  })();

  /* =========================================================================
     MODULE 3: STORAGE (IndexedDB + localStorage Fallback)
     ========================================================================= */
  const StorageModule = (() => {
    const DB_NAME = 'KronoAppDB';
    const LS_KEY = 'krono_state_v1';
    let db = null;

    function openDB() {
      return new Promise(resolve => {
        try {
          if (typeof indexedDB === 'undefined') return resolve(null);
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains('state')) e.target.result.createObjectStore('state'); };
          req.onsuccess = e => { db = e.target.result; resolve(db); };
          req.onerror = () => resolve(null);
        } catch { resolve(null); }
      });
    }
    async function load() {
      if (!db) await openDB();
      if (db) {
        return new Promise(resolve => {
          try {
            const req = db.transaction('state', 'readonly').objectStore('state').get('main');
            req.onsuccess = () => resolve(req.result || loadLS(LS_KEY));
            req.onerror = () => resolve(loadLS(LS_KEY));
          } catch { resolve(loadLS(LS_KEY)); }
        });
      }
      return loadLS(LS_KEY);
    }
    async function save(data) {
      saveLS(LS_KEY, data);
      if (!db) return;
      return new Promise(resolve => {
        try {
          const tx = db.transaction('state', 'readwrite');
          tx.objectStore('state').put(data, 'main');
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        } catch { resolve(false); }
      });
    }
    function loadLS(k) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch { return null; } }
    function saveLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
    return { load, save, loadLS, saveLS };
  })();

  /* =========================================================================

     ========================================================================= */
  const GitHubSync = (() => {
    const KEY = 'krono_gh_private';
    const META_KEY = 'krono_gh_sync_meta';

    function getCreds() {
      return { token: '', owner: '', repo: '', branch: 'main', path: 'krono-tasks.json', ...(StorageModule.loadLS(KEY) || {}) };
    }
    function saveCreds(c) { StorageModule.saveLS(KEY, c); renderSyncChip(); }
    function isConfigured() { const c = getCreds(); return Boolean(c.token && c.owner && c.repo && c.path); }

    function getMeta() {
      return { state: 'idle', pending: false, lastSync: null, lastError: '', ...(StorageModule.loadLS(META_KEY) || {}) };
    }
    function setMeta(patch) {
      const next = { ...getMeta(), ...patch };
      StorageModule.saveLS(META_KEY, next);
      renderSyncChip();
      return next;
    }

    function u2b(s) { let b = ''; new TextEncoder().encode(s).forEach(x => b += String.fromCharCode(x)); return btoa(b); }
    function b2u(b) { const bin = atob(b.replace(/\n/g, '')); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new TextDecoder().decode(arr); }
    function url(c) { return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/')}`; }
    function cleanToken(t) { return String(t || '').replace(/^(Bearer|token)\s+/i, '').replace(/\s+/g, ''); }
    function hdr(c, isWrite = false) {
      const h = {
        'Authorization': `Bearer ${cleanToken(c.token)}`,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      };
      if (isWrite) h['Content-Type'] = 'application/json';
      return h;
    }

    function renderSyncChip() {
      const chip = document.getElementById('syncStatusChip');
      if (!chip) return;
      const meta = getMeta();
      if (!isConfigured()) {
        chip.innerHTML = `<span class="sync-dot pending"></span><span>${I18N.t('sync.localOnly')}</span>`;
        return;
      }
      if (meta.state === 'syncing') {
        chip.innerHTML = `<span class="sync-dot syncing"></span><span>${I18N.t('sync.syncing')}</span>`;
      } else if (meta.pending || meta.state === 'error' || !navigator.onLine) {
        chip.innerHTML = `<span class="sync-dot pending"></span><span>${I18N.t('sync.pending')}</span>`;
      } else if (meta.lastSync) {
        chip.innerHTML = `<span class="sync-dot"></span><span>${I18N.t('sync.synced')}</span>`;
      } else {
        chip.innerHTML = `<span class="sync-dot pending"></span><span>${I18N.t('sync.pending')}</span>`;
      }
    }

    function markPending() {
      if (!isConfigured()) { renderSyncChip(); return; }
      setMeta({ pending: true });
      if (navigator.onLine) {
        // Attempt background sync automatically when online; if it fails, pending stays true in browser!
        clearTimeout(markPending._t);
        markPending._t = setTimeout(() => sync('push', true), 1200);
      }
    }

    async function test() {
      const c = getCreds(); if (!isConfigured()) return { ok: false, msg: 'Incomplete settings' };
      try {
        const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`, { headers: hdr(c, false) });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          return { ok: false, msg: `HTTP ${r.status}: ${e.message || r.statusText}` };
        }
        const j = await r.json(); return { ok: true, msg: `${j.full_name} (${j.default_branch || 'main'})`, defaultBranch: j.default_branch };
      } catch (e) { return { ok: false, msg: e.message }; }
    }

    async function sync(mode = 'push', silent = false) {
      if (!isConfigured()) { if (!silent) Toast.show(I18N.t('sync.localOnly')); return false; }
      if (!navigator.onLine) {
        setMeta({ state: 'error', pending: true, lastError: 'Offline' });
        if (!silent) Toast.show(I18N.t('sync.pending'));
        return false;
      }
      const c = getCreds();
      setMeta({ state: 'syncing', lastError: '' });
      try {
        const res = await fetch(`${url(c)}?ref=${encodeURIComponent(c.branch || 'main')}`, { headers: hdr(c, false), cache: 'no-store' });
        let remote = { exists: false, sha: null, data: null };
        if (res.ok) {
          const j = await res.json();
          let parsedData = null;
          const rawText = (j.content ? b2u(j.content) : '').trim();
          if (rawText) {
            try { parsedData = JSON.parse(rawText); } catch {}
          }
          remote = { exists: true, sha: j.sha, data: parsedData };
        }
        else if (res.status !== 404) { const ge = await res.json().catch(() => ({})); throw new Error(`HTTP ${res.status}: ${ge.message || res.statusText}`); }

        if (mode === 'pull') {
          if (!remote.exists || !remote.data) throw new Error('Remote file is empty or invalid JSON');
          Store.replace(remote.data);
          setMeta({ state: 'ok', pending: false, lastSync: new Date().toISOString(), lastError: '' });
          if (!silent) Toast.show(I18N.t('sync.synced'));
          return true;
        }
        const body = { message: `KRONO sync ${new Date().toISOString()}`, content: u2b(JSON.stringify(Store.exportable(), null, 2)), branch: c.branch || 'main' };
        if (remote.sha) body.sha = remote.sha;
        const put = await fetch(url(c), { method: 'PUT', headers: hdr(c, true), body: JSON.stringify(body) });
        if (!put.ok) { const pe = await put.json().catch(() => ({})); throw new Error(`HTTP ${put.status}: ${pe.message || put.statusText}`); }
        setMeta({ state: 'ok', pending: false, lastSync: new Date().toISOString(), lastError: '' });
        if (!silent) Toast.show(I18N.t('sync.synced'));
        return true;
      } catch (e) {
        const errMsg = e.message || 'Sync error';
        setMeta({ state: 'error', pending: true, lastError: errMsg });
        if (!silent) Toast.show(errMsg);
        return false;
      }
    }

    function initAutoRetry() {
      window.addEventListener('online', () => {
        if (isConfigured() && getMeta().pending) sync('push', true);
        else renderSyncChip();
      });
      window.addEventListener('offline', renderSyncChip);
      if (isConfigured() && getMeta().pending && navigator.onLine) {
        sync('push', true);
      }
      renderSyncChip();
    }

    return { getCreds, saveCreds, isConfigured, getMeta, markPending, test, sync, renderSyncChip, initAutoRetry };
  })();

  /* =========================================================================
     MODULE 5: MONOCHROME THEME ENGINE (Pure B&W + Adjustable Glass Opacity/Blur/Ratio)
     ========================================================================= */
  const Theme = (() => {
    function apply(st) {
      const root = document.documentElement;
      const isLight = st.theme === 'light';
      root.setAttribute('data-theme', isLight ? 'light' : 'dark');

      // Working Glass Opacity slider (0..100 mapped cleanly for Dark and Light)
      const opPct = Math.max(0, Math.min(100, Number(st.glassOpacity ?? 35)));
      const mainAlpha = isLight
        ? (0.30 + (opPct / 100) * 0.65).toFixed(3)   // 0.30 .. 0.95
        : (0.02 + (opPct / 100) * 0.24).toFixed(3);  // 0.02 .. 0.26
      const subAlpha = isLight
        ? (0.18 + (opPct / 100) * 0.50).toFixed(3)
        : (0.01 + (opPct / 100) * 0.14).toFixed(3);

      root.style.setProperty('--glass-alpha', mainAlpha);
      root.style.setProperty('--glass-sub-alpha', subAlpha);
      root.style.setProperty('--glass-blur', (Number(st.glassBlur ?? 18)) + 'px');
      root.style.setProperty('--font-size', (Number(st.fontSize ?? 14)) + 'px');

      const r = Number(st.borderRadius ?? 16);
      root.style.setProperty('--radius', r + 'px');
      root.style.setProperty('--radius-sm', Math.max(6, Math.round(r * 0.68)) + 'px');
      root.style.setProperty('--radius-lg', Math.round(r * 1.25) + 'px');

      const ratio = Math.max(28, Math.min(68, Number(st.tasksRatio ?? 50)));
      root.style.setProperty('--tasks-ratio', ratio + '%');
      const h = document.getElementById('splitHandle');
      if (h) h.classList.toggle('locked', Boolean(st.lockSplitRatio));
    }
    return { apply };
  })();

  /* =========================================================================
     MODULE 6: STORE & SEED DATA
     ========================================================================= */
  const Store = (() => {
    const uid = () => 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    function defaultSettings() {
      return {
        theme: 'dark',
        glassOpacity: 35,
        glassBlur: 18,
        tasksRatio: 50,
        lockSplitRatio: false,
        fontSize: 14,
        borderRadius: 16,
        language: 'fa',
        calendarSystem: 'jalali',
        firstDayOfWeek: 6,
        hijriOffset: 0
      };
    }
    function seed() {
      const today = CalendarEngine.todayISO();
      const yesterday = CalendarEngine.addDaysISO(today, -1);
      const tomorrow = CalendarEngine.addDaysISO(today, 1);
      const now = new Date().toISOString();
      return {
        updatedAt: now,
        settings: defaultSettings(),
        tasks: [
          { id: 't1', title: 'ارسال گزارش دیروز', description: 'کار انجام‌نشده که به امروز منتقل شده است', date: yesterday, startTime: '14:00', endTime: '14:30', priority: 'urgent', status: 'todo', recurrence: 'none', checklist: [], updatedAt: now },
          { id: 't2', title: 'مرور برنامه امروز و اولویت‌ها', description: '', date: today, startTime: '09:30', endTime: '10:30', priority: 'high', status: 'todo', recurrence: 'daily', checklist: [{ id: 'c1', text: 'بررسی پیام‌ها', done: true }, { id: 'c2', text: 'شروع کار اصلی', done: false }], updatedAt: now },
          { id: 't3', title: 'مطالعه ۴۵ دقیقه', description: '', date: today, startTime: '18:00', endTime: '18:45', priority: 'medium', status: 'todo', recurrence: 'none', checklist: [], updatedAt: now },
          { id: 't4', title: 'آماده‌سازی کارهای فردا', description: '', date: tomorrow, startTime: '10:00', endTime: '11:00', priority: 'medium', status: 'todo', recurrence: 'none', checklist: [], updatedAt: now },
          { id: 't5', title: 'مرتب‌سازی فایل‌های شخصی', description: '', date: '', startTime: '', endTime: '', priority: 'low', status: 'todo', recurrence: 'none', checklist: [], updatedAt: now }
        ]
      };
    }

    let state = seed();
    const subs = new Set();

    async function init() {
      const saved = await StorageModule.load();
      if (saved && saved.settings) {
        state = { ...seed(), ...saved, settings: { ...defaultSettings(), ...saved.settings } };
      } else {
        await StorageModule.save(state);
      }
      I18N.setLang(state.settings.language);
      Theme.apply(state.settings);
    }
    function commit() {
      state.updatedAt = new Date().toISOString();
      StorageModule.save(state);
      GitHubSync.markPending();
      subs.forEach(fn => fn(state));
    }
    function replace(next) {
      state = { ...seed(), ...next, settings: { ...defaultSettings(), ...(next.settings || {}) } };
      I18N.setLang(state.settings.language);
      Theme.apply(state.settings);
      StorageModule.save(state);
      subs.forEach(fn => fn(state));
    }
    function wipe() {
      state = { updatedAt: new Date().toISOString(), settings: state.settings, tasks: [] };
      StorageModule.save(state);
      GitHubSync.markPending();
      subs.forEach(fn => fn(state));
    }
    return { init, get: () => state, exportable: () => JSON.parse(JSON.stringify(state)), commit, replace, wipe, subscribe: fn => subs.add(fn), uid };
  })();

  /* =========================================================================
     MODULE 7: UI HELPERS (Toast, Modal)
     ========================================================================= */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const Toast = {
    show(msg) {
      const stack = document.getElementById('toastStack');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      stack.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 180); }, 2500);
    }
  };
  const Modal = (() => {
    const bd = () => document.getElementById('modalBackdrop');
    function open({ title, bodyHtml, footerHtml = '', onOpen }) {
      document.getElementById('modalTitle').textContent = title;
      const body = document.getElementById('modalBody');
      const footer = document.getElementById('modalFooter');
      body.innerHTML = bodyHtml;
      footer.innerHTML = footerHtml;
      bd().classList.add('open');
      if (onOpen) onOpen(body, footer);
    }
    function close() { bd().classList.remove('open'); }
    return { open, close };
  })();

  /* =========================================================================
     MODULE 8: MAIN APP (KRONO)
     ========================================================================= */
  const App = (() => {
    let selectedISO = CalendarEngine.todayISO();
    let calFocusISO = selectedISO;
    let taskMode = 'day';
    let draggedTaskId = null;

    function nextRecurrence(iso, rec) {
      if (!iso || !rec || rec === 'none') return null;
      if (rec === 'daily') return CalendarEngine.addDaysISO(iso, 1);
      if (rec === 'weekly') return CalendarEngine.addDaysISO(iso, 7);
      const g = CalendarEngine.parseISO(iso);
      if (rec === 'monthly') { const d = new Date(g.y, g.m, g.d); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
      return rec === 'yearly' ? `${g.y + 1}-${String(g.m).padStart(2, '0')}-${String(g.d).padStart(2, '0')}` : null;
    }

    function toggleTask(id) {
      const s = Store.get();
      const t = s.tasks.find(x => x.id === id);
      if (!t) return;
      const nowDone = t.status !== 'done';
      t.status = nowDone ? 'done' : 'todo';
      t.updatedAt = new Date().toISOString();
      if (nowDone && t.recurrence && t.recurrence !== 'none' && t.date) {
        const nd = nextRecurrence(t.date, t.recurrence);
        if (nd && !s.tasks.some(x => x.title === t.title && x.date === nd)) {
          s.tasks.push({ ...JSON.parse(JSON.stringify(t)), id: Store.uid(), date: nd, status: 'todo', checklist: (t.checklist || []).map(c => ({ ...c, done: false })), updatedAt: new Date().toISOString() });
        }
      }
      Store.commit();
    }

    function getTasksForDate(iso) {
      const s = Store.get();
      const today = CalendarEngine.todayISO();
      const prevDay = CalendarEngine.addDaysISO(iso, -1);

      const direct = s.tasks.filter(t => t.date === iso).map(t => ({
        task: t,
        isOverdue: Boolean(t.status !== 'done' && t.date < today)
      }));

      let rolledOver = [];
      if (iso === today) {
        rolledOver = s.tasks
          .filter(t => t.status !== 'done' && t.date && t.date < today)
          .map(t => ({ task: t, isOverdue: true, rolledFrom: t.date }));
      } else if (iso > today) {
        rolledOver = s.tasks
          .filter(t => t.status !== 'done' && t.date === prevDay)
          .map(t => ({ task: t, isOverdue: true, rolledFrom: t.date }));
      }

      return [...rolledOver, ...direct].sort((a, b) => {
        if (a.task.status === 'done' && b.task.status !== 'done') return 1;
        if (a.task.status !== 'done' && b.task.status === 'done') return -1;
        if (a.isOverdue && !b.isOverdue) return -1;
        if (!a.isOverdue && b.isOverdue) return 1;
        return (a.task.startTime || '99:99').localeCompare(b.task.startTime || '99:99');
      });
    }

    function openTaskModal(task = null) {
      const s = Store.get();
      const isEdit = Boolean(task);
      const t = task || { title: '', description: '', date: taskMode === 'undated' ? '' : selectedISO, startTime: '', endTime: '', priority: 'medium', status: 'todo', recurrence: 'none', checklist: [] };
      let checklist = JSON.parse(JSON.stringify(t.checklist || []));

      Modal.open({
        title: isEdit ? I18N.t('editTask') : I18N.t('newTask'),
        bodyHtml: `
          <div class="form-group"><label class="form-label">${I18N.t('title')}</label><input class="input" id="tfTitle" value="${esc(t.title)}" /></div>
          <div class="form-group"><label class="form-label">${I18N.t('desc')}</label><textarea class="textarea" id="tfDesc" rows="2">${esc(t.description)}</textarea></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">${I18N.t('date')}</label><input type="date" class="input" id="tfDate" value="${t.date || ''}" /></div>
            <div class="form-group"><label class="form-label">${I18N.t('priority')}</label>
              <select class="select" id="tfPrio">${['low', 'medium', 'high', 'urgent'].map(p => `<option value="${p}" ${t.priority === p ? 'selected' : ''}>${I18N.t('prio.' + p)}</option>`).join('')}</select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">${I18N.t('startTime')}</label><input type="time" class="input" id="tfStart" value="${t.startTime || ''}" /></div>
            <div class="form-group"><label class="form-label">${I18N.t('endTime')}</label><input type="time" class="input" id="tfEnd" value="${t.endTime || ''}" /></div>
          </div>
          <div class="form-group"><label class="form-label">${I18N.t('recurrence')}</label>
            <select class="select" id="tfRec">${['none', 'daily', 'weekly', 'monthly', 'yearly'].map(r => `<option value="${r}" ${t.recurrence === r ? 'selected' : ''}>${I18N.t('rec.' + r)}</option>`).join('')}</select>
          </div>
          <div class="form-group">
            <label class="form-label">${I18N.t('checklist')}</label>
            <div id="tfChk" style="display:flex;flex-direction:column;gap:5px;margin-bottom:6px;"></div>
            <div style="display:flex;gap:6px;"><input class="input" id="tfNewStep" placeholder="${I18N.t('addStep')}" /><button class="btn" type="button" id="tfAddStep">${I18N.t('add')}</button></div>
          </div>
        `,
        footerHtml: `
          ${isEdit ? `<button class="btn" id="tfDel" style="margin-inline-end:auto">${Icons.trash} ${I18N.t('delete')}</button>` : ''}
          <button class="btn" id="tfCancel">${I18N.t('cancel')}</button>
          <button class="btn btn-solid" id="tfSave">${I18N.t('save')}</button>
        `,
        onOpen: (body, footer) => {
          const chkEl = body.querySelector('#tfChk');
          const renderChk = () => {
            chkEl.innerHTML = checklist.map((c, i) => `
              <div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--glass-bg-subtle);border:1px solid var(--glass-border);border-radius:8px;">
                <input type="checkbox" data-i="${i}" ${c.done ? 'checked' : ''} />
                <span style="flex:1;font-size:0.86em;${c.done ? 'text-decoration:line-through;opacity:0.5' : ''}">${esc(c.text)}</span>
                <button class="btn btn-sm" type="button" data-d="${i}">${Icons.trash}</button>
              </div>
            `).join('');
            chkEl.querySelectorAll('input').forEach(cb => cb.addEventListener('change', () => { checklist[Number(cb.dataset.i)].done = cb.checked; renderChk(); }));
            chkEl.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { checklist.splice(Number(b.dataset.d), 1); renderChk(); }));
          };
          renderChk();
          const addStep = () => {
            const inp = body.querySelector('#tfNewStep');
            if (!inp.value.trim()) return;
            checklist.push({ id: Store.uid(), text: inp.value.trim(), done: false });
            inp.value = ''; renderChk();
          };
          body.querySelector('#tfAddStep').addEventListener('click', addStep);
          body.querySelector('#tfNewStep').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addStep(); } });

          footer.querySelector('#tfCancel').addEventListener('click', Modal.close);
          if (isEdit) {
            footer.querySelector('#tfDel').addEventListener('click', () => {
              s.tasks = s.tasks.filter(x => x.id !== t.id);
              Store.commit(); Modal.close();
            });
          }
          footer.querySelector('#tfSave').addEventListener('click', () => {
            const title = body.querySelector('#tfTitle').value.trim();
            if (!title) return;
            const data = {
              title, description: body.querySelector('#tfDesc').value.trim(),
              date: body.querySelector('#tfDate').value,
              startTime: body.querySelector('#tfStart').value, endTime: body.querySelector('#tfEnd').value,
              priority: body.querySelector('#tfPrio').value, recurrence: body.querySelector('#tfRec').value,
              checklist, updatedAt: new Date().toISOString()
            };
            if (isEdit) Object.assign(t, data);
            else s.tasks.unshift({ id: Store.uid(), status: 'todo', ...data });
            Store.commit(); Modal.close();
          });
          setTimeout(() => body.querySelector('#tfTitle').focus(), 40);
        }
      });
    }

    function openSearchModal() {
      const s = Store.get();
      Modal.open({
        title: I18N.t('search'),
        bodyHtml: `<input class="input" id="srchInp" placeholder="${I18N.t('search')}..." style="margin-bottom:10px;" /><div id="srchRes" style="display:flex;flex-direction:column;gap:7px;"></div>`,
        onOpen: body => {
          const inp = body.querySelector('#srchInp'), res = body.querySelector('#srchRes');
          const run = () => {
            const q = inp.value.trim().toLowerCase();
            const hits = s.tasks.filter(t => !q || (t.title + ' ' + t.description).toLowerCase().includes(q));
            res.innerHTML = hits.length ? hits.slice(0, 20).map(t => `
              <div class="task-card ${t.status === 'done' ? 'done' : ''}" data-sid="${t.id}">
                <div class="task-content">
                  <div class="task-title">${esc(t.title)}</div>
                  <div class="task-meta">${t.date ? CalendarEngine.formatISO(t.date, s.settings.calendarSystem, I18N.getLang(), s.settings.hijriOffset) : I18N.t('undated')}</div>
                </div>
              </div>
            `).join('') : `<div class="empty-tasks">${I18N.t('emptyDay')}</div>`;
            res.querySelectorAll('[data-sid]').forEach(el => el.addEventListener('click', () => {
              const t = s.tasks.find(x => x.id === el.dataset.sid);
              if (t && t.date) { selectedISO = t.date; calFocusISO = t.date; taskMode = 'day'; }
              Modal.close(); render();
              if (t) openTaskModal(t);
            }));
          };
          inp.addEventListener('input', run); run();
          setTimeout(() => inp.focus(), 40);
        }
      });
    }

    function openGoToDateModal() {
      const st = Store.get().settings;
      const cur = CalendarEngine.fromISO(calFocusISO, st.calendarSystem, st.hijriOffset);
      Modal.open({
        title: I18N.t('goToDate'),
        bodyHtml: `
          <div class="form-row">
            <div class="form-group"><label class="form-label">${I18N.t('year')}</label><input type="text" inputmode="numeric" class="input input-num" id="gtY" value="${cur.y}" /></div>
            <div class="form-group"><label class="form-label">${I18N.t('month')}</label>
              <select class="select" id="gtM">${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${cur.m === i + 1 ? 'selected' : ''}>${CalendarEngine.getMonthName(st.calendarSystem, i + 1, I18N.getLang())}</option>`).join('')}</select>
            </div>
          </div>
          <div class="form-group"><label class="form-label">${I18N.t('day')}</label><input type="text" inputmode="numeric" class="input input-num" id="gtD" value="${cur.d}" /></div>
        `,
        footerHtml: `<button class="btn" id="gtNo">${I18N.t('cancel')}</button><button class="btn btn-solid" id="gtGo">${I18N.t('jump')}</button>`,
        onOpen: (body, f) => {
          f.querySelector('#gtNo').addEventListener('click', Modal.close);
          f.querySelector('#gtGo').addEventListener('click', () => {
            const y = parseIntSafe(body.querySelector('#gtY').value, cur.y);
            const m = Math.max(1, Math.min(12, parseIntSafe(body.querySelector('#gtM').value, cur.m)));
            const maxD = CalendarEngine.monthLength(y, m, st.calendarSystem);
            const d = Math.max(1, Math.min(maxD, parseIntSafe(body.querySelector('#gtD').value, 1)));
            selectedISO = CalendarEngine.toISO(y, m, d, st.calendarSystem, st.hijriOffset);
            calFocusISO = selectedISO;
            Modal.close(); render();
          });
        }
      });
    }

    function render() {
      const s = Store.get(), st = s.settings, today = CalendarEngine.todayISO(), sys = st.calendarSystem, lang = I18N.getLang();
      const wdName = CalendarEngine.WEEKDAYS_FULL[lang][CalendarEngine.weekdayOfISO(selectedISO)];

      document.getElementById('headerDateTitle').textContent = `${wdName}، ${CalendarEngine.formatISO(selectedISO, sys, lang, st.hijriOffset)}`;
      GitHubSync.renderSyncChip();

      const todayBtn = document.getElementById('btnTodayQuick');
      todayBtn.textContent = I18N.t('today');
      todayBtn.style.display = selectedISO !== today ? 'inline-flex' : 'none';

      document.getElementById('tabDayLabel').textContent = I18N.t('dayTab');
      document.getElementById('tabAllLabel').textContent = I18N.t('allTab');
      document.getElementById('tabUndatedLabel').textContent = I18N.t('undated');
      document.querySelectorAll('#taskModeTabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === taskMode));

      const occs = taskMode === 'day' ? CalendarEngine.getOccasions(selectedISO, st.hijriOffset) : [];
      document.getElementById('occasionsStrip').innerHTML = occs.map(o => `<span class="badge ${o.holiday ? 'badge-solid' : ''}">${esc(o[lang])}</span>`).join('');

      let items = [];
      if (taskMode === 'day') {
        items = getTasksForDate(selectedISO);
      } else if (taskMode === 'all') {
        items = [...s.tasks].map(t => ({
          task: t,
          isOverdue: Boolean(t.status !== 'done' && t.date && t.date < today),
          showDate: true
        })).sort((a, b) => {
          if (a.task.status === 'done' && b.task.status !== 'done') return 1;
          if (a.task.status !== 'done' && b.task.status === 'done') return -1;
          if (a.isOverdue && !b.isOverdue) return -1;
          if (!a.isOverdue && b.isOverdue) return 1;
          return (a.task.date || '9999').localeCompare(b.task.date || '9999');
        });
      } else {
        items = s.tasks.filter(t => !t.date).map(t => ({ task: t, isOverdue: false }));
      }

      document.getElementById('tasksSectionTitle').textContent = taskMode === 'day' ? I18N.t('dayTasks') : taskMode === 'all' ? I18N.t('allTasks') : I18N.t('undated');
      document.getElementById('tasksCountBadge').textContent = I18N.num(items.length);

      const scrollEl = document.getElementById('tasksScroll');
      if (!items.length) {
        const emptyTxt = taskMode === 'day' ? I18N.t('emptyDay') : taskMode === 'all' ? I18N.t('emptyAll') : I18N.t('emptyUndated');
        scrollEl.innerHTML = `<div class="empty-tasks"><span>${emptyTxt}</span></div>`;
      } else {
        scrollEl.innerHTML = items.map(({ task: t, isOverdue, rolledFrom, showDate }) => {
          const chkTot = (t.checklist || []).length, chkDone = (t.checklist || []).filter(c => c.done).length;
          const dateBadge = rolledFrom
            ? CalendarEngine.formatISO(rolledFrom, sys, lang, st.hijriOffset, false)
            : (showDate ? (t.date ? CalendarEngine.formatISO(t.date, sys, lang, st.hijriOffset, false) : I18N.t('undated')) : '');
          return `
            <div class="task-card ${t.status === 'done' ? 'done' : ''} ${isOverdue ? 'overdue' : ''}" draggable="true" data-drag="${t.id}" data-edit="${t.id}">
              <button class="check-btn ${t.status === 'done' ? 'checked' : ''}" data-chk="${t.id}" aria-label="Complete">${t.status === 'done' ? Icons.check : ''}</button>
              <div class="task-content">
                <div class="task-title">${esc(t.title)}</div>
                <div class="task-meta">
                  ${isOverdue ? `<span class="badge badge-solid">${I18N.t('overdue')}</span>` : ''}
                  ${dateBadge ? `<span class="badge">${dateBadge}</span>` : ''}
                  ${t.startTime ? `<span>${I18N.num(t.startTime)}${t.endTime ? ' - ' + I18N.num(t.endTime) : ''}</span>` : ''}
                  <span class="badge">${I18N.t('prio.' + (t.priority || 'medium'))}</span>
                  ${chkTot ? `<span class="badge">${I18N.num(chkDone)}/${I18N.num(chkTot)}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      scrollEl.querySelectorAll('[data-chk]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); toggleTask(b.dataset.chk); }));
      scrollEl.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => {
        const t = s.tasks.find(x => x.id === el.dataset.edit);
        if (t) openTaskModal(t);
      }));
      scrollEl.querySelectorAll('[data-drag]').forEach(el => el.addEventListener('dragstart', () => { draggedTaskId = el.dataset.drag; }));

      // Lower Calendar
      const cur = CalendarEngine.fromISO(calFocusISO, sys, st.hijriOffset);
      document.getElementById('calPrev').innerHTML = lang === 'fa' ? Icons.chevRight : Icons.chevLeft;
      document.getElementById('calNext').innerHTML = lang === 'fa' ? Icons.chevLeft : Icons.chevRight;
      document.getElementById('calMonthLabel').textContent = `${CalendarEngine.getMonthName(sys, cur.m, lang)} ${I18N.num(cur.y)}`;
      document.querySelectorAll('#calSysPills button').forEach(b => {
        b.textContent = I18N.t('cal.' + b.dataset.sys);
        b.classList.toggle('active', b.dataset.sys === sys);
      });

      const order = CalendarEngine.getWeekdayOrder(st.firstDayOfWeek);
      document.getElementById('calWeekdays').innerHTML = order.map(w => `<div>${CalendarEngine.WEEKDAYS_SHORT[lang][w]}</div>`).join('');

      const len = CalendarEngine.monthLength(cur.y, cur.m, sys);
      const firstISO = CalendarEngine.toISO(cur.y, cur.m, 1, sys, st.hijriOffset);
      const startOffset = order.indexOf(CalendarEngine.weekdayOfISO(firstISO));
      const totalCells = Math.ceil((startOffset + len) / 7) * 7;

      const daysEl = document.getElementById('calDays');
      let cellsHtml = '';
      for (let i = 0; i < totalCells; i++) {
        const iso = CalendarEngine.addDaysISO(firstISO, i - startOffset);
        const dObj = CalendarEngine.fromISO(iso, sys, st.hijriOffset);
        const dayTasks = s.tasks.filter(t => t.date === iso);
        const hasPending = dayTasks.some(t => t.status !== 'done');
        const hasDone = dayTasks.some(t => t.status === 'done');
        const occsDay = CalendarEngine.getOccasions(iso, st.hijriOffset);
        const isHoliday = (CalendarEngine.weekdayOfISO(iso) === 5 && sys === 'jalali') || occsDay.some(o => o.holiday);

        cellsHtml += `
          <button class="cal-day ${dObj.m === cur.m ? '' : 'other-month'} ${iso === today ? 'is-today' : ''} ${iso === selectedISO ? 'is-selected' : ''} ${isHoliday ? 'is-holiday' : ''}" data-day="${iso}">
            <span>${I18N.num(dObj.d)}</span>
            <span class="cal-dots">
              ${hasPending ? '<span class="cal-dot"></span>' : ''}
              ${hasDone ? '<span class="cal-dot muted"></span>' : ''}
            </span>
          </button>
        `;
      }
      daysEl.innerHTML = cellsHtml;

      daysEl.querySelectorAll('[data-day]').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedISO = btn.dataset.day;
          calFocusISO = selectedISO;
          taskMode = 'day';
          render();
        });
        btn.addEventListener('dragover', e => { e.preventDefault(); btn.classList.add('drag-over'); });
        btn.addEventListener('dragleave', () => btn.classList.remove('drag-over'));
        btn.addEventListener('drop', e => {
          e.preventDefault(); btn.classList.remove('drag-over');
          const t = s.tasks.find(x => x.id === draggedTaskId);
          if (t) { t.date = btn.dataset.day; t.updatedAt = new Date().toISOString(); Store.commit(); Toast.show(CalendarEngine.formatISO(t.date, sys, lang, st.hijriOffset, false)); }
          draggedTaskId = null;
        });
      });
    }

    function shiftMonth(delta) {
      const st = Store.get().settings;
      const cur = CalendarEngine.fromISO(calFocusISO, st.calendarSystem, st.hijriOffset);
      let m = cur.m + delta, y = cur.y;
      while (m > 12) { m -= 12; y += 1; }
      while (m < 1) { m += 12; y -= 1; }
      calFocusISO = CalendarEngine.toISO(y, m, 1, st.calendarSystem, st.hijriOffset);
      render();
    }

    function initSplitDrag() {
      const handle = document.getElementById('splitHandle');
      const splitBody = document.getElementById('splitBody');
      let dragging = false;

      const onMove = clientY => {
        if (!dragging) return;
        const rect = splitBody.getBoundingClientRect();
        const pct = Math.max(28, Math.min(68, Math.round(((clientY - rect.top) / rect.height) * 100)));
        Store.get().settings.tasksRatio = pct;
        Theme.apply(Store.get().settings);
      };

      handle.addEventListener('pointerdown', e => {
        if (Store.get().settings.lockSplitRatio) return;
        dragging = true;
        handle.classList.add('dragging');
        handle.setPointerCapture(e.pointerId);
      });
      handle.addEventListener('pointermove', e => { if (dragging) onMove(e.clientY); });
      const end = () => {
        if (!dragging) return;
        dragging = false;
        handle.classList.remove('dragging');
        Store.commit();
      };
      handle.addEventListener('pointerup', end);
      handle.addEventListener('pointercancel', end);
    }

    function bindEvents() {
      document.getElementById('btnTodayQuick').addEventListener('click', () => { selectedISO = CalendarEngine.todayISO(); calFocusISO = selectedISO; taskMode = 'day'; render(); });
      document.getElementById('btnAddTask').addEventListener('click', () => openTaskModal(null));
      document.getElementById('btnSettings').addEventListener('click', () => openSettingsModal('general'));
      document.getElementById('btnSearch').addEventListener('click', openSearchModal);
      document.getElementById('syncStatusChip').addEventListener('click', () => {
        if (GitHubSync.isConfigured()) GitHubSync.sync('push');
        else openSettingsModal('github');
      });
      document.getElementById('calPrev').addEventListener('click', () => shiftMonth(-1));
      document.getElementById('calNext').addEventListener('click', () => shiftMonth(1));
      document.getElementById('calMonthLabel').addEventListener('click', openGoToDateModal);
      document.querySelectorAll('#calSysPills button').forEach(b => b.addEventListener('click', () => {
        Store.get().settings.calendarSystem = b.dataset.sys; Store.commit();
      }));
      document.querySelectorAll('#taskModeTabs button').forEach(b => b.addEventListener('click', () => { taskMode = b.dataset.mode; render(); }));
      document.getElementById('modalCloseBtn').addEventListener('click', Modal.close);
      document.getElementById('modalBackdrop').addEventListener('click', e => { if (e.target.id === 'modalBackdrop') Modal.close(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') Modal.close();
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearchModal(); }
      });
      initSplitDrag();
    }

    async function bootstrap() {
      try {
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
          const sw = new Blob([`const C='krono-offline-v1';self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.addAll(['./']).catch(()=>{})));});self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',e=>{if(e.request.method!=='GET'||e.request.url.includes('api.github.com'))return;e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});`], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(sw)).catch(() => {});
        }
      } catch {}
      await Store.init();
      Store.subscribe(render);
      GitHubSync.initAutoRetry();
      bindEvents();
      render();
    }
    return { bootstrap };
  })();

  window.addEventListener('DOMContentLoaded', () => App.bootstrap());
  </script>
</body>
</html>
